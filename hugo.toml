baseURL = "https://rhino-inquisitor.com/"
defaultContentLanguage = "en"
languageCode = "en-us"
timeZone = "UTC"
title = "Rhino Inquisitor"
contentDir = "src/content"
layoutDir = "src/layouts"
staticDir = ["src/static"]
assetDir = "src/assets"
dataDir = "src/data"
archetypeDir = "src/archetypes"
publishDir = "public"
# Agent guides (AGENTS.md) live inside the content tree for editor/agent
# discovery but must never become rendered pages or sitemap entries.
ignoreFiles = ['AGENTS\.md$']
paginate = 12
buildDrafts = false
buildFuture = false
buildExpired = false
enableRobotsTXT = true

[mediaTypes."text/markdown"]
suffixes = ["md"]

# remains monolingual, so Hugo emits a single root sitemap.xml.

[outputs]
home = ["html", "rss", "json", "llms", "llmsfull", "sitemap", "sitemapindex", "postsitemap", "pagesitemap", "categorysitemap", "videositemap", "imagesitemap"]
page = ["html", "markdown"]
section = ["html", "rss"]
taxonomy = ["html"]
term = ["html"]

[outputFormats.sitemapindex]
mediaType = "application/xml"
baseName = "sitemap_index"
isPlainText = false
notAlternative = true

[outputFormats.postsitemap]
mediaType = "application/xml"
baseName = "post-sitemap"
isPlainText = false
notAlternative = true

[outputFormats.pagesitemap]
mediaType = "application/xml"
baseName = "page-sitemap"
isPlainText = false
notAlternative = true

[outputFormats.categorysitemap]
mediaType = "application/xml"
baseName = "category-sitemap"
isPlainText = false
notAlternative = true

[outputFormats.videositemap]
mediaType = "application/xml"
baseName = "video-sitemap"
isPlainText = false
notAlternative = true

[outputFormats.imagesitemap]
mediaType = "application/xml"
baseName = "image-sitemap"
isPlainText = false
notAlternative = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.llmsfull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true

[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

# IMPORTANT: Any change to generated route or taxonomy config below requires an
# immediate RHI-025 URL parity re-run before merge.
[taxonomies]
category = "categories"

[permalinks.taxonomy]
categories = "/category/"

[permalinks.term]
categories = "/category/:slug/"

[sitemap]
filename = "sitemap.xml"

[minify]
disableXML = false

[params]
description = "Technical articles, migration notes, and platform guidance from Rhino Inquisitor."
defaultSocialImage = "/images/social-default.svg"

[params.seoDefaults]
maxSnippet = -1
maxImagePreview = "large"
maxVideoPreview = -1
