<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
  <head>
    <script>
      (function(){var t=localStorage.getItem('theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark')}})();
    </script>
    {{ block "head" . }}
      {{ partial "seo/head-meta.html" . }}
      {{ partial "site/stylesheet.html" . }}
    {{ end }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {{ partial "site/header.html" . }}

    <main class="site-main" id="main-content" tabindex="-1">
      <div class="surface-shell">
        {{ block "main" . }}{{ end }}
      </div>
    </main>

    {{ partial "site/footer.html" . }}

    {{ block "scripts" . }}{{ end }}
  </body>
</html>
