<form class="search-404" action="{{ "posts/" | relURL }}#archive-search" method="get" role="search">
  <label for="search-404-input" class="visually-hidden">Search the blog archive</label>
  <div class="search-404__row">
    <input
      id="search-404-input"
      name="q"
      type="search"
      autocomplete="off"
      placeholder="Search by title, topic, or keyword&hellip;"
    >
    <button type="submit">Search</button>
  </div>
</form>
