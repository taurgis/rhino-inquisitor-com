{{ $seo := partial "seo/resolve.html" . }}

<meta property="og:title" content="{{ $seo.title }}">
<meta property="og:description" content="{{ $seo.description }}">
<meta property="og:type" content="{{ $seo.ogType }}">
<meta property="og:url" content="{{ $seo.canonical }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ $seo.image }}">
{{ with $seo.image }}<meta property="og:image:alt" content="{{ $seo.title }}">{{ end }}

{{ if and .IsPage (eq .Type "posts") }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:author" content="{{ .Params.author | default .Site.Title }}">
{{ range .Params.categories }}<meta property="article:section" content="{{ . }}">
{{ end }}
{{ range .Params.tags }}<meta property="article:tag" content="{{ . }}">
{{ end }}
{{ end }}

<meta name="twitter:card" content="{{ $seo.twitterCard }}">
<meta name="twitter:title" content="{{ $seo.title }}">
<meta name="twitter:description" content="{{ $seo.description }}">
<meta name="twitter:image" content="{{ $seo.image }}">
{{ with $seo.image }}<meta name="twitter:image:alt" content="{{ $seo.title }}">{{ end }}
