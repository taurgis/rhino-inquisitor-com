{{- $headRow := index .THead 0 -}}
<div class="table-scroll" tabindex="0">
  <table
    {{- range $k, $v := .Attributes }}
      {{- if $v }}
        {{- printf " %s=%q" $k $v | safeHTMLAttr }}
      {{- end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
        <tr>
          {{- range . }}
            <th scope="col"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >
              {{- .Text -}}
            </th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range $i, $cell := . }}
            <td
              {{- with $cell.Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end }}
              {{- with $headRow }}
                {{- with index . $i }}
                  {{- printf " data-label=%q" (.Text | plainify) | safeHTMLAttr }}
                {{- end }}
              {{- end -}}
            >
              {{- $cell.Text -}}
            </td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
