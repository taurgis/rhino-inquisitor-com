{{ $links := .links | default (slice) }}
{{ if gt (len $links) 0 }}
  <nav class="jump-year" aria-label="Jump to year" data-search-year-jump data-archive-year-controls>
    <div>
      <p class="eyebrow">Jump to year</p>
      <p class="surface-note">Skip directly to a dated archive cluster.</p>
    </div>
    <div class="jump-year__links">
      {{ range $links }}
        <a class="surface-chip" href="{{ .url }}" aria-label="Jump to year {{ .label }}">{{ .label }}</a>
      {{ end }}
    </div>
  </nav>
{{ end }}
