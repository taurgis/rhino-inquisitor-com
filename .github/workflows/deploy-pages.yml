name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.157.0
  NODE_VERSION: 22.22.2
  AVIF_CACHE_VERSION: 1
  EXPECTED_PAGES_HOST: rhino-inquisitor.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.gate_scope.outputs.deploy_needed }}
      gate_matrix: ${{ steps.gate_scope.outputs.gate_matrix }}
      scope: ${{ steps.gate_scope.outputs.scope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine deploy and gate scope from changed files
        id: gate_scope
        shell: bash
        run: |
          set -euo pipefail

          # Classify the push into one of three scopes:
          #
          #   docs    — every changed file is repo meta/documentation that has
          #             no effect on the built site (README, LICENSE, docs/,
          #             monitoring/, agent instructions, ...). Skip the build,
          #             all gates, and the Pages deploy: the published output
          #             would be byte-identical.
          #   content — every changed file is docs-inert or lives under
          #             src/content/. Build + deploy, but skip perf (bundle
          #             unchanged, most expensive) and security (headers/
          #             redirect/host config unchanged).
          #   full    — anything else (templates, config, scripts, workflows,
          #             static assets, url-data, dependencies). Full gate
          #             suite + deploy. Anything we cannot diff confidently
          #             (workflow_dispatch, first push, force-push, missing
          #             parent, empty diff) also falls back here.
          docs_re='^(docs|monitoring|\.claude|\.github/instructions|\.github/agents|\.github/skills)/|^(README\.md|LICENSE|SECURITY\.md|AGENTS\.md|skills-lock\.json|\.gitignore)$'
          content_re='^src/content/'

          scope=full
          if [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -n "$before" \
              && "$before" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git diff --name-only "$before" "${{ github.sha }}" > changed-files.txt
              if [[ -s changed-files.txt ]]; then
                if ! grep -Eqv -e "$docs_re" changed-files.txt; then
                  scope=docs
                elif ! grep -Eqv -e "$docs_re" -e "$content_re" changed-files.txt; then
                  scope=content
                fi
              fi
            fi
          fi

          deploy_needed=true
          case "$scope" in
            docs)
              deploy_needed=false
              # Never consumed — build_site (and therefore gates/deploy) is
              # skipped when deploy_needed=false. Kept non-empty so the gates
              # matrix stays valid if the job condition is ever removed.
              gate_matrix='[{"group":"url"},{"group":"seo"},{"group":"security"},{"group":"a11y","browser":true},{"group":"perf","browser":true}]'
              ;;
            content)
              gate_matrix='[{"group":"url"},{"group":"seo"},{"group":"a11y","browser":true}]'
              ;;
            *)
              gate_matrix='[{"group":"url"},{"group":"seo"},{"group":"security"},{"group":"a11y","browser":true},{"group":"perf","browser":true}]'
              ;;
          esac

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
          echo "gate_matrix=$gate_matrix" >> "$GITHUB_OUTPUT"

          {
            case "$scope" in
              docs)
                echo "Docs-only push detected: no site output changes — skipping build, gates, and Pages deploy."
                ;;
              content)
                echo "Content-only push detected: running url, seo, a11y gates (skipping perf, security)."
                ;;
              *)
                echo "Route-sensitive push: running the full gate suite (url, seo, security, a11y, perf)."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  build_site:
    needs: scope
    if: needs.scope.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      pages_host_ready: ${{ steps.pages_host.outputs.ready }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Hugo extended binary cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/hugo/${{ env.HUGO_VERSION }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}

      - name: Install Hugo extended
        shell: bash
        run: |
          set -euo pipefail
          HUGO_DIR="$HOME/.cache/hugo/${HUGO_VERSION}"
          if [[ ! -x "$HUGO_DIR/hugo" ]]; then
            mkdir -p "$HUGO_DIR"
            HUGO_TARBALL="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
            RELEASE_BASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
            curl -fsSL -o "$RUNNER_TEMP/$HUGO_TARBALL" "$RELEASE_BASE/$HUGO_TARBALL"
            # Verify the tarball against the release's published sha256 list
            # before extracting anything (the extracted binary is cached and
            # reused across runs). grep failing (no matching line) or a digest
            # mismatch both abort the job via pipefail / sha256sum exit code.
            curl -fsSL -o "$RUNNER_TEMP/hugo_checksums.txt" "$RELEASE_BASE/hugo_${HUGO_VERSION}_checksums.txt"
            (cd "$RUNNER_TEMP" && grep -E "[[:space:]]${HUGO_TARBALL}\$" hugo_checksums.txt | sha256sum -c -)
            tar -xzf "$RUNNER_TEMP/$HUGO_TARBALL" -C "$HUGO_DIR" hugo
          fi
          export PATH="$HUGO_DIR:$PATH"
          echo "$HUGO_DIR" >> "$GITHUB_PATH"
          hugo version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Summarize Pages host configuration
        id: pages_host
        env:
          EXPECTED_PAGES_HOST: ${{ env.EXPECTED_PAGES_HOST }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PAGES_BASE_URL" || -z "$PAGES_HOST" ]]; then
            echo "Missing GitHub Pages site metadata from actions/configure-pages." >&2
            exit 1
          fi

          if [[ "$PAGES_HOST" != "$EXPECTED_PAGES_HOST" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages host is '$PAGES_HOST', expected '$EXPECTED_PAGES_HOST'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages production host '$PAGES_HOST' is active." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute AVIF cache fingerprint
        id: avif_cache_fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs/promises');
          const path = require('node:path');

          const repoRoot = process.cwd();
          const sourceRoots = [
            path.join(repoRoot, 'src', 'content'),
            path.join(repoRoot, 'src', 'assets')
          ];
          const excludedRoot = path.join(repoRoot, 'src', 'assets', 'generated-avif');
          const allowedExtensions = new Set(['.jpg', '.jpeg', '.png', '.webp']);

          async function collectFiles(directory, files) {
            let entries;
            try {
              entries = await fs.readdir(directory, { withFileTypes: true });
            } catch {
              return;
            }

            for (const entry of entries) {
              const absolutePath = path.join(directory, entry.name);
              if (absolutePath === excludedRoot || absolutePath.startsWith(`${excludedRoot}${path.sep}`)) {
                continue;
              }

              if (entry.isDirectory()) {
                await collectFiles(absolutePath, files);
                continue;
              }

              if (entry.isFile() && allowedExtensions.has(path.extname(entry.name).toLowerCase())) {
                files.push(absolutePath);
              }
            }
          }

          async function main() {
            const files = [];
            for (const sourceRoot of sourceRoots) {
              await collectFiles(sourceRoot, files);
            }

            files.sort((left, right) => left.localeCompare(right));

            const fingerprint = crypto.createHash('sha256');
            for (const filePath of files) {
              fingerprint.update(path.relative(repoRoot, filePath));
              fingerprint.update('\0');
              fingerprint.update(await fs.readFile(filePath));
              fingerprint.update('\0');
            }

            const output = process.env.GITHUB_OUTPUT;
            await fs.appendFile(output, `value=${fingerprint.digest('hex')}\n`, 'utf8');
            console.log(`AVIF source fingerprint covers ${files.length} image(s).`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          EOF

      - name: Restore generated AVIF cache
        id: avif_cache
        uses: actions/cache@v5
        with:
          path: src/assets/generated-avif
          key: ${{ runner.os }}-avif-${{ env.AVIF_CACHE_VERSION }}-node-${{ env.NODE_VERSION }}-lock-${{ hashFiles('package-lock.json') }}-generator-${{ hashFiles('scripts/generate-avif-cache.js') }}-images-${{ steps.avif_cache_fingerprint.outputs.value }}
          # The generator is incremental (skips derivatives that already
          # exist), so a stale restore is always safe — it only means the
          # delta gets re-encoded. Fall back progressively rather than
          # re-encoding the entire image set (~30 min) whenever the lockfile,
          # generator, or Node version changes.
          restore-keys: |
            ${{ runner.os }}-avif-${{ env.AVIF_CACHE_VERSION }}-node-${{ env.NODE_VERSION }}-lock-${{ hashFiles('package-lock.json') }}-generator-${{ hashFiles('scripts/generate-avif-cache.js') }}-
            ${{ runner.os }}-avif-${{ env.AVIF_CACHE_VERSION }}-node-${{ env.NODE_VERSION }}-
            ${{ runner.os }}-avif-${{ env.AVIF_CACHE_VERSION }}-

      - name: Summarize generated AVIF cache status
        env:
          CACHE_HIT: ${{ steps.avif_cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "Generated AVIF cache restored from an exact key match." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CACHE_HIT" == "false" ]]; then
            echo "Generated AVIF cache restored from a prefix match and will be refreshed after a successful build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Generated AVIF cache miss; this run will regenerate AVIF derivatives and save them for future runs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify Sharp AVIF runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const sharp = require('sharp');

          async function main() {
            const input = Buffer.from([
              0xff, 0x00, 0x00, 0xff,
              0x00, 0x80, 0xff, 0xff,
              0x20, 0xc0, 0x40, 0xff,
              0x10, 0x10, 0x10, 0xff
            ]);

            const output = await sharp(input, {
              raw: {
                width: 2,
                height: 2,
                channels: 4
              }
            }).avif({ quality: 40 }).toBuffer();

            if (!Buffer.isBuffer(output) || output.length === 0) {
              throw new Error('Sharp AVIF smoke check produced no output.');
            }

            console.log(`Sharp AVIF smoke check passed (${output.length} bytes).`);
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          EOF

      - name: Regenerate critical CSS from built site
        shell: bash
        run: |
          set -euo pipefail

          # The critical-*.css files are generated (penthouse extraction from
          # the built site.css) but live in the repo, so a stale or hand-edited
          # commit would otherwise be inlined verbatim into every page. Build
          # once to produce public/, regenerate the critical files from it,
          # and let the gate build below rebuild with the regenerated files —
          # the deployed HTML always inlines critical CSS derived from the
          # exact site.css being shipped.
          npm run build:prod
          npm run generate:critical-css

          if git diff --quiet -- 'src/assets/styles/critical-*.css'; then
            echo "Committed critical CSS is in sync with the regenerated files."
            echo "Committed critical CSS is in sync with the regenerated files." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "> [!WARNING]"
              echo "> Committed critical CSS was stale. This deploy uses the regenerated version, but the repo still carries the stale files."
              echo "> Run \`npm run build:prod && npm run generate:critical-css\` locally and commit the updated \`src/assets/styles/critical-*.css\` (also available in this run's build-outputs artifact, and as a 'git apply'-able diff in this step's log)."
              echo ">"
              git diff --stat -- 'src/assets/styles/critical-*.css' | sed 's/^/> /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Committed critical CSS is stale; full drift diff follows (pipe into 'git apply' to sync the committed files):"
            git --no-pager diff -- 'src/assets/styles/critical-*.css'
          fi

      - name: Run blocking deployment quality gates (build)
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RHI_HTTPS_LIVE_HOST_READY: ${{ steps.pages_host.outputs.ready }}
        run: npm run gates:local -- --group build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ github.sha }}
          path: |
            public/
            tmp/
            src/assets/styles/critical-*.css
          retention-days: 1
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  gates:
    needs:
      - scope
      - build_site
    runs-on: ubuntu-latest
    name: gate (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.gate_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The a11y leg runs pa11y-ci, which drives puppeteer — it needs the
          # puppeteer Chromium. Every other leg only launches Playwright.
          skip-puppeteer-download: ${{ matrix.group == 'a11y' && 'false' || 'true' }}

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs-${{ github.sha }}

      - name: Restore Playwright browser cache
        if: ${{ matrix.browser }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: ${{ matrix.browser }}
        run: npx playwright install --with-deps chromium

      - name: Run blocking deployment quality gates (${{ matrix.group }})
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RHI_HTTPS_LIVE_HOST_READY: ${{ needs.build_site.outputs.pages_host_ready }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.group }}" == "perf" ]]; then
            export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          fi
          npm run gates:local -- --group "${{ matrix.group }}"

      - name: Summarize perf gate blocking findings
        if: ${{ failure() && matrix.group == 'perf' }}
        shell: bash
        run: |
          set -euo pipefail
          report=validation/performance-budget-report.json
          {
            echo "### Perf gate blocking findings"
            if [[ -f "$report" ]]; then
              jq -r '.entries[] | select((.blockingFindings | length) > 0) | "- \(.template) \(.route): \(.blockingFindings | join("; "))"' "$report"
              echo
              echo "| template | route | mobile perf | mobile CLS | desktop perf |"
              echo "|----------|-------|-------------|------------|--------------|"
              jq -r '.entries[] | "| \(.template) | \(.route) | \(.profiles.mobile.scores.performance // "n/a") | \(.profiles.mobile.metrics.cls // "n/a") | \(.profiles.desktop.scores.performance // "n/a") |"' "$report"
            else
              echo "No performance-budget-report.json was produced."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload perf gate diagnostics
        if: ${{ failure() && matrix.group == 'perf' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-diagnostics-${{ github.run_id }}
          path: |
            validation/performance-budget-report.json
            validation/lhci-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload a11y gate diagnostics
        if: ${{ failure() && matrix.group == 'a11y' }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-gate-diagnostics-${{ github.run_id }}
          path: url-data/reports/accessibility-audit.md
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs:
      - build_site
      - gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      # The Pages service occasionally fails a deployment with a transient
      # "Deployment failed, try again later." (seen during syncing_files).
      # Give it one automatic second attempt before failing the run.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Summarize deployed URL
        shell: bash
        run: |
          {
            echo "Pages URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
            if [[ "${{ steps.deployment.outcome }}" == "failure" ]]; then
              echo "First deploy attempt failed transiently; succeeded on automatic retry."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
